services:
  - type: web
    name: aanya-otp-service
    env: python
    rootDir: otp-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: OTP_TTL_SECONDS
        value: 30
      - key: OTP_SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: Aanya Fashion <no-reply@aanyafashions.com>
      - key: SMS_GATEWAY_WEBHOOK_URL
        sync: false
